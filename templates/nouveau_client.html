{% extends 'base.html' %}
{% block title %}Nouveau client{% endblock %}
{% block content %}
<div class="page-header">
    <div><h2>Nouveau client</h2><p>Enregistrer un nouveau client dans le système</p></div>
    <a href="{{ url_for('clients') }}" class="btn btn-ghost">← Retour</a>
</div>

<div class="card" style="max-width:600px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Nom *</label>
                <input type="text" name="nom" placeholder="Ex : Diallo" required>
            </div>
            <div class="form-group">
                <label>Prénom *</label>
                <input type="text" name="prenom" placeholder="Ex : Moussa" required>
            </div>
            <div class="form-group">
                <label>Nationalité *</label>
                <input type="text" name="nationalite" placeholder="Ex : Sénégalaise" required>
            </div>
            <div class="form-group">
                <label>Téléphone *</label>
                <input type="text" name="telephone" placeholder="Ex : +221771234567" required>
            </div>
            <div class="form-group full">
                <label>Email *</label>
                <input type="email" name="email" placeholder="Ex : moussa.diallo@email.com" required>
            </div>
        </div>
        <div style="margin-top:20px;display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">✅ Enregistrer le client</button>
            <a href="{{ url_for('clients') }}" class="btn btn-ghost">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
